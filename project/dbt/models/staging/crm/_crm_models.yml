version: 2

models:
  - name: stg_crm_accounts
    columns:
      - name: account_id
        data_tests:
          - unique
          - not_null

      - name: segment
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - MID_MARKET
                  - ENTERPRISE

      - name: region
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - US_EAST
                  - US_WEST
                  - UK

  - name: stg_crm_contacts
    columns:
      - name: contact_id
        data_tests:
          - unique
          - not_null

      - name: account_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_crm_accounts')
                field: account_id

  - name: stg_crm_owners
    columns:
      - name: owner_id
        data_tests:
          - unique
          - not_null

  - name: stg_crm_opportunities
    columns:
      - name: opp_id
        data_tests:
          - unique
          - not_null

      - name: account_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_crm_accounts')
                field: account_id

      - name: owner_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_crm_owners')
                field: owner_id

      - name: opportunity_type
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - NEW_BUSINESS
                  - RENEWAL
                  - EXPANSION

      - name: stage_normalized
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - DISCOVERY
                  - EVALUATION
                  - PROPOSAL
                  - NEGOTIATION
                  - CLOSED_WON
                  - CLOSED_LOST
                  - UNKNOWN

  - name: stg_crm_opportunity_source_links
    columns:
      - name: source_link_id
        data_tests:
          - unique
          - not_null

      - name: opp_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_crm_opportunities')
                field: opp_id

  - name: stg_crm_opportunity_stage_events
    columns:
      - name: stage_event_id
        data_tests:
          - unique
          - not_null

      - name: opp_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_crm_opportunities')
                field: opp_id

  - name: stg_crm_opportunity_field_events
    columns:
      - name: field_event_id
        data_tests:
          - unique
          - not_null

      - name: opp_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_crm_opportunities')
                field: opp_id